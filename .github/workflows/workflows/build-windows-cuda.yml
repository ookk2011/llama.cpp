name: Build llama-prism Windows CUDA

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (Release/Debug)'
        required: true
        default: 'Release'
      cuda_arch:
        description: 'CUDA Architecture (e.g., 120)'
        required: true
        default: '120'

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup CUDA Toolkit 12.4
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: "12.4.0"
          method: "network"
          sub-packages: '["nvcc","cudart","cublas","cublas_dev","thrust","visual_studio_integration"]'

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build_type }} `
            -DGGML_CUDA=ON `
            -DCMAKE_CUDA_ARCHITECTURES=${{ github.event.inputs.cuda_arch }} `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_BUILD_CLI=ON `
            -DBUILD_SHARED_LIBS=ON

      - name: Build
        run: cmake --build build --config ${{ github.event.inputs.build_type }} -j 4

      - name: Pack CUDA runtime DLLs
        run: |
          $cudaPath = "${{ steps.cuda-toolkit.outputs.CUDA_PATH }}"
          New-Item -ItemType Directory -Force -Path cudart-pack | Out-Null
          Copy-Item "$cudaPath\bin\cudart64_12.dll" cudart-pack\
          Copy-Item "$cudaPath\bin\cublas64_12.dll" cudart-pack\
          Copy-Item "$cudaPath\bin\cublasLt64_12.dll" cudart-pack\
          Compress-Archive -Path cudart-pack\* -DestinationPath cudart-llama-bin-win-cu12.4-x64.zip -Force

      - name: Upload llama-prism binaries
        uses: actions/upload-artifact@v4
        with:
          name: llama-prism-win-cuda-x64
          path: |
            build\bin\${{ github.event.inputs.build_type }}\llama-server.exe
            build\bin\${{ github.event.inputs.build_type }}\llama-cli.exe
            build\bin\${{ github.event.inputs.build_type }}\*.dll

      - name: Upload CUDA runtime
        uses: actions/upload-artifact@v4
        with:
          name: cudart-win-cuda-12.4-x64
          path: cudart-llama-bin-win-cu12.4-x64.zip
